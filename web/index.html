<!DOCTYPE html><html><head>

    This is a placeholder for base href that will be replaced by the value of

  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!-- Content Security Policy -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://www.gstatic.com;
    style-src 'self' 'unsafe-inline';

      https://*.googleapis.com

      https://*.firebasedatabase.app
      wss://*.firebasedatabase.app
      https://*.cloudfunctions.net
      https://*.google.com;
    img-src 'self' data: blob:;
    font-src 'self' data: https://fonts.gstatic.com;
    frame-src 'self' https://*.firebaseapp.com;

    base-uri 'self';

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <title>servicebo</title>
  <link rel="manifest" href="manifest.json">
  <style id="splash-screen-style">
    html {
      height: 100%
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #ffffff;
          background-size: 100% 100%;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      -ms-transform: translate(-50%, -50%);
      transform: translate(-50%, -50%);
    }

    .contain {
      display:block;
      width:100%; height:100%;
      object-fit: contain;
    }

    .stretch {
      display:block;
      width:100%; height:100%;
    }

    .cover {
      display:block;
      width:100%; height:100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      -ms-transform: translate(-50%, 0);
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }
  </style>
  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "transparent";
    }
  </script>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
</head>
<body>
  <picture id="splash">
      <source srcset="splash/img/light-1x.png 1x, splash/img/light-2x.png 2x, splash/img/light-3x.png 3x, splash/img/light-4x.png 4x" media="(prefers-color-scheme: light)">
      <source srcset="splash/img/dark-1x.png 1x, splash/img/dark-2x.png 2x, splash/img/dark-3x.png 3x, splash/img/dark-4x.png 4x" media="(prefers-color-scheme: dark)">
      <img class="center" aria-hidden="true" src="splash/img/light-1x.png" alt="">
  </picture>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->

  <script>
    // ── Force SW update on page load ──
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (reg) {
          reg.update();
          if (reg.waiting) {
            reg.waiting.postMessage({ type: 'SKIP_WAITING' });
          }
        });
      });
      // When a new SW takes over, reload
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (document.getElementById('update-overlay')) {
          window.location.reload();
        }
      });
    }
  </script>

  <script>
    // ── Version check: polls version.json every 60s ──
    (function () {
      var initialBuild = null;

      function fetchVersion() {
        return fetch('/version.json?_t=' + Date.now())
          .then(function (r) { return r.json(); })
          .then(function (j) { return j.build_number || j.version; });
      }

      fetchVersion().then(function (v) {
        initialBuild = v;
      });

      setInterval(function () {
        if (!initialBuild) return;
        fetchVersion().then(function (v) {
          if (v && v !== initialBuild) {
            showUpdateOverlay();
          }
        }).catch(function () { /* network error, skip */ });
      }, 120000); // cada 120 segundos

      function showUpdateOverlay() {
        if (document.getElementById('update-overlay')) return;
        var overlay = document.createElement('div');
        overlay.id = 'update-overlay';
        overlay.style.cssText = 'position:fixed;inset:0;z-index:999999;'
          + 'background:rgba(0,0,0,0.7);display:flex;align-items:center;'
          + 'justify-content:center;';
        overlay.innerHTML = '<div style="background:#fff;border-radius:12px;'
          + 'padding:32px 40px;text-align:center;max-width:400px;'
          + 'font-family:sans-serif;">'
          + '<h2 style="margin:0 0 12px;">Nueva versión disponible</h2>'
          + '<p style="color:#555;margin:0 0 24px;">Se ha publicado una '
          + 'actualización. Pulsa el botón para cargar la nueva versión.</p>'
          + '<button onclick="location.reload(true)" style="background:#0058bd;'
          + 'color:#fff;border:none;padding:12px 32px;border-radius:8px;'
          + 'font-size:16px;cursor:pointer;">Actualizar ahora</button></div>';
        document.body.appendChild(overlay);
      }
    })();
  </script>

  <script src="flutter_bootstrap.js" async=""></script>


</body></html>
