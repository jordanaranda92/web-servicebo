name: servicebo
description: A new Flutter project
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  # Service locator / https://pub.dev/packages/get_it
  get_it: ^9.0.0
  # Bloc for state management / https://pub.dev/packages/flutter_bloc
  flutter_bloc: ^9.0.0
  # Value equality / https://pub.dev/packages/equatable
  equatable: ^2.0.7
  # Functional programming / https://pub.dev/packages/fpdart
  fpdart: ^1.2.0
  # Flutter localization (SDK)
  flutter_localizations:
    sdk: flutter
  # Internationalization / https://pub.dev/packages/intl
  intl: ^0.20.2
  # Shared preferences / https://pub.dev/packages/shared_preferences
  shared_preferences: ^2.5.5
  # Package info / https://pub.dev/packages/package_info_plus
  package_info_plus: ^8.3.0
  # HTTP client / https://pub.dev/packages/dio
  dio: ^5.9.2
  # File picker / https://pub.dev/packages/file_picker
  file_picker: ^11.0.2
  # Secure storage / https://pub.dev/packages/flutter_secure_storage
  flutter_secure_storage: ^10.0.0
  # Excel file read/write / https://pub.dev/packages/excel
  excel: ^4.0.6
  # PDF generation / https://pub.dev/packages/pdf
  pdf: ^3.12.0
  # PDF printing & preview / https://pub.dev/packages/printing
  printing: ^5.13.5
  # Firebase Core / https://pub.dev/packages/firebase_core
  firebase_core: ^4.7.0
  # Firebase Realtime Database / https://pub.dev/packages/firebase_database
  firebase_database: ^12.4.0
  # Firebase Authentication / https://pub.dev/packages/firebase_auth
  firebase_auth: ^6.5.0
  # Firebase Firestore / https://pub.dev/packages/cloud_firestore
  cloud_firestore: ^6.4.0
  # Firebase Cloud Functions / https://pub.dev/packages/cloud_functions
  cloud_functions: ^6.3.0
  # Reactive extensions for Dart / https://pub.dev/packages/rxdart
  rxdart: ^0.28.0
  # Skeletonizer / https://pub.dev/packages/skeletonizer
  skeletonizer: ^2.1.3
  # Web APIs (replaces dart:html) / https://pub.dev/packages/web
  web: ^1.1.1
  # Declarative routing / https://pub.dev/packages/go_router
  go_router: ^14.8.1
  # Flutter Web Plugins (URL strategy) / Flutter SDK
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  # Flutter Launcher Icons / https://pub.dev/packages/flutter_launcher_icons
  flutter_launcher_icons: ^0.14.4

  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # Mocking library for tests / https://pub.dev/packages/mocktail
  mocktail: ^1.0.4
  # BLoC testing / https://pub.dev/packages/bloc_test
  bloc_test: ^10.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/data/
    - assets/icons/
    - assets/fonts/
    - assets/images/
